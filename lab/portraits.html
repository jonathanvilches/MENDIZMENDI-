<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#2d2448;display:flex;flex-wrap:wrap;gap:6px;padding:6px}img{width:160px;height:160px;background:radial-gradient(#6d5a9a,#2d2448);border-radius:16px}</style></head><body><script type="module">
import { avatarPortrait, portrait } from '../src/ui/portraits.js';
import { COSTUMES } from '../src/actors/minifig.js';
import { LEVELS } from '../src/data/levels.js';
const ids = Object.keys(COSTUMES);
let html = ids.map(id => `<img src="${avatarPortrait(id)}">`).join('');
const hosts = LEVELS.flatMap(l => (l.missions||[]).filter(m => m.host).map(m => m.host)).slice(0, 14);
html += hosts.map(h => `<img src="${portrait(h.look)}" title="${h.name}">`).join('');
html += ids.slice(0,3).map(id => `<img src="${avatarPortrait(id,'full')}">`).join('');
document.body.innerHTML = html; window.__ready = true;
</script></body></html>
