<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dibujos de los oficios</title><link rel="icon" href="data:,">
<style>body{margin:0;background:#1c0b3a;color:#fff;font:14px Nunito,sans-serif}.row{display:flex;gap:6px;align-items:center;margin:4px}.row b{width:70px}canvas{width:300px;height:125px;border-radius:8px}</style></head><body>
<script type="module">
import { tradeArt, TRADE_ARTS } from '../src/ui/tradeArt.js';
const only = new URLSearchParams(location.search).get('arts');
for (const id of (only ? only.split(',') : TRADE_ARTS)) {
  const row = document.createElement('div'); row.className = 'row'; row.innerHTML = `<b>${id}</b>`; document.body.appendChild(row);
  for (const [p, hit] of [[0, 9], [0.5, 0.12], [1, 9]]) { const A = tradeArt(id); A.draw(p, hit, true); row.appendChild(A.canvas); }
}
window.__ready = true;
</script></body></html>
