<!doctype html><html><head><meta charset="utf-8"><title>Hojas</title>
<style>body{margin:0;background:#eef3e6;font:700 13px Nunito,sans-serif;color:#2a3a20}.g{display:grid;grid-template-columns:repeat(auto-fill,150px);gap:6px;padding:8px}.c{background:#fff;border-radius:10px;text-align:center;padding:4px}.c img{width:140px;height:140px}</style></head>
<body><div class="g" id="g"></div><script type="module">
// Todas las hojas dibujadas (src/ui/leafArt.js): ?only=haya,roble
import { leafImage } from '../src/ui/leafArt.js';
import { FLORA } from '../src/data/flora.js';
const only = new URLSearchParams(location.search).get('only')?.split(',');
for (const id of Object.keys(FLORA)) { if (only && !only.includes(id)) continue; const u = leafImage(id); document.getElementById('g').insertAdjacentHTML('beforeend', `<div class="c"><img src="${u || ''}"><div>${FLORA[id].name}</div></div>`); }
window.__ready = true;
</script></body></html>
