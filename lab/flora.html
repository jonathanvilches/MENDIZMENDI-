<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flora de Navarra · modelos</title>
<style>body{margin:0;background:#16241a;color:#eef4e6;font:14px Nunito,Arial,sans-serif}h1{margin:12px 16px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:0 16px 16px}
figure{margin:0;background:#22362a;border-radius:12px;overflow:hidden}figure img{width:100%;display:block;aspect-ratio:6/5;background:#eef4e6}figcaption{padding:6px 8px}figcaption b{display:block}figcaption i{color:#b8d4a8;font-size:12px}</style>
</head><body><h1>Flora de Navarra · modelos 3D</h1><div class="g" id="g"></div>
<script type="module">
import { FLORA } from '../src/data/flora.js';
import { floraPortrait } from '../src/world/flora3d.js';
import { showFicha } from '../src/ui/ficha.js';
const g = document.getElementById('g'), only = new URLSearchParams(location.search).get('only');
const ids = Object.keys(FLORA).filter(id => !only || only.split(',').includes(id));
for (const id of ids) {
  const F = FLORA[id], f = document.createElement('figure');
  f.innerHTML = `<img alt=""><figcaption><b>${F.name}</b><i>${F.sci}</i></figcaption>`; g.appendChild(f);
  f.onclick = () => showFicha('flora:' + id);
  f.querySelector('img').src = await floraPortrait(id);
}
window.__ready = true;
</script></body></html>
