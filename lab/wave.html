<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#3b2466;overflow:hidden}</style></head><body><script type="module">
import * as THREE from 'three';
import { buildMinifig, MinifigAnimator, COSTUMES } from '../src/actors/minifig.js';
const q = new URLSearchParams(location.search), ids = (q.get('k') || 'leire,unai,iker,maialen').split(','), act = q.get('a') || 'wave';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#3b2466');
scene.add(new THREE.HemisphereLight('#fff6e8', '#4a3a5a', 1.6)); const key = new THREE.DirectionalLight('#fff0d8', 2.4); key.position.set(2, 4, 3); scene.add(key);
const times = [0.1, 0.35, 0.6, 0.85];
let x = 0; const cols = [];
ids.forEach((id, i) => times.forEach((t, j) => {
  const f = buildMinifig(COSTUMES[id], { hero: true }); const a = new MinifigAnimator(f);
  const steps = Math.round((0.6 + t) / 0.016); for (let s = 0; s < steps; s++) a.update(0.016, { speed: 0, grounded: true, wave: act === 'wave' ? 1.2 : 0, cheer: act === 'cheer' ? 1 : 0, talking: act === 'talk' ? 1 : 0 });
  f.position.set(j * 1.1 - 1.65, 0, -i * 0.0); f.position.y = -i * 2.0; f.rotation.y = +(q.get('ry') ?? 0.25); scene.add(f);
}));
const cam = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.1, 100); const n = ids.length; cam.position.set(0, -(n - 1), 6 + n * 2.6); cam.lookAt(0, -(n - 1) + 0.8, 0);
if (q.get('face')) { cam.fov = 12; cam.updateProjectionMatrix(); cam.position.set(-1.65, 1.3, 4.2); cam.lookAt(-1.65, 1.22, 0); }
r.render(scene, cam); window.__ready = true;
</script></body></html>
