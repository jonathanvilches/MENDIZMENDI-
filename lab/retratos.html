<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retratos de personajes</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block}</style></head><body>
<script type="module">
// Retratos para el menú (tools/retratos.mjs): un avatar (?avatar=leire) o una figura de leyenda o carnaval
// (?figura=joaldun, con su traje de npcGlb.js), con las mismas luces y el mismo encuadre que los retratos
// de los chicos: busto (view=bust), cuerpo entero (view=full) o grande (view=hero). ry gira al personaje. Fondo
// transparente. Avisa con window.__ready cuando está dibujado.
import * as THREE from 'three';
import { loadGlbAvatar, GlbRig } from '../src/actors/glbChar.js';
import { buildNpc, preloadNpcs } from '../src/actors/npcGlb.js';
import { FOLK } from '../src/game/townGame.js';

const q = new URLSearchParams(location.search), view = q.get('view') || 'full', ry = +(q.get('ry') || 0.3);
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(innerWidth, innerHeight);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#ffffff', '#6a5a4a', 1.3));
const sun = new THREE.DirectionalLight('#fff4e0', 2.4); sun.position.set(2, 4, 3); scene.add(sun);
const rim = new THREE.DirectionalLight('#cfe8ff', 1.0); rim.position.set(-3, 2, -3); scene.add(rim);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 200);

let root, anim = null;
if (q.get('avatar')) {
  const rig = new GlbRig(await loadGlbAvatar(q.get('avatar')), q.get('avatar'));
  root = rig.obj; anim = (dt) => rig.update(dt, 0, true, 0);
  rig.setExpr?.('happy', 1e9);
} else {
  await preloadNpcs();
  const id = q.get('figura'), look = { ...(FOLK[id] || {}) }; if (!look.traje) look.traje = id;
  const n = buildNpc(look); root = n.obj; anim = (dt) => n.anim.update(dt, { speed: 0, wave: 0, cheer: 0, talking: 0 });
}
scene.add(root); root.rotation.y = ry;
// (unos fotogramas de animación, para que la pose de reposo se asiente y las telas cuelguen)
for (let i = 0; i < 12; i++) anim?.(1 / 30);
root.updateMatrixWorld(true);
const box = new THREE.Box3(), t = new THREE.Box3();
root.traverse(o => { if (!o.isMesh || !o.visible) return; if (o.isSkinnedMesh) { o.skeleton.update(); o.computeBoundingBox(); t.copy(o.boundingBox); } else { o.geometry.computeBoundingBox(); t.copy(o.geometry.boundingBox); } box.union(t.applyMatrix4(o.matrixWorld)); });
const H = box.max.y - box.min.y, cx = (box.min.x + box.max.x) / 2, cz = (box.min.z + box.max.z) / 2, y0 = box.min.y;
if (view === 'bust') { const c = new THREE.Vector3(cx, y0 + H * 0.78, cz), d = H * 1.25; cam.position.set(c.x + Math.sin(0.25) * d * 0.4, c.y + H * 0.04, c.z + d); cam.lookAt(c); }
else { const c = new THREE.Vector3(cx, y0 + H * 0.5, cz), d = H * (view === 'hero' ? 2.9 : 3.0); cam.position.set(c.x, y0 + H * 0.62, c.z + d); cam.lookAt(c); }
cam.updateProjectionMatrix();
r.render(scene, cam);
window.__ready = true;
</script></body></html>
