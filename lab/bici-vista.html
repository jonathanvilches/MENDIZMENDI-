<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#cfd8dc}canvas{display:block}</style>
<script type="module">
import * as THREE from 'three';
import { biciModel } from '/src/game/conducir.js';
const W = 1200, H = 800, r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
r.setScissorTest(true);
const s = new THREE.Scene(); s.background = new THREE.Color('#cfd8dc');
s.add(new THREE.HemisphereLight('#ffffff', '#667', 1.6)); const d = new THREE.DirectionalLight('#fff', 2.2); d.position.set(3, 5, 2); s.add(d);
const b = biciModel(); s.add(b);
const vistas = [[2.2, 0.8, 0], [0.01, 0.9, 2.2], [1.4, 1.6, 1.4], [-1.6, 1.0, -1.4]];
vistas.forEach((p, i) => { const c = new THREE.PerspectiveCamera(32, (W / 2) / (H / 2), 0.05, 50); c.position.set(...p); c.lookAt(0, 0.5, 0); const x = (i % 2) * W / 2, y = (i < 2 ? H / 2 : 0); r.setViewport(x, y, W / 2, H / 2); r.setScissor(x, y, W / 2, H / 2); r.render(s, c); });
window.__listo = true;
</script>
