<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Herrizherri · Mando</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<!--
  El móvil como mando de Herrizherri (src/mando/ es la otra mitad, en el ordenador). El ordenador enseña un código; esta
  página se apunta con él en un servidor público de PeerJS solo para el saludo y, después, habla directamente con el
  ordenador por la wifi con WebRTC. El ordenador le dice en qué se está y qué botones poner (src/mando/contextos.js): los
  del pueblo, los de la pelota o el fútbol y, en cada minijuego, una copia de sus botones de la pantalla, con un panel
  táctil para lo demás. Aquí solo se pintan y se mandan los toques.
-->
<style>
:root { --v1: #1e0a44; --rosa: #ff7ac8; --lila: #cbc2e0; --ok: #3ee07a; --cta: linear-gradient(100deg, #ff2bd6, #c21cff 55%, #7b2ff7); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 30%, #3a1680, #12052a 70%); color: #f6f3fc; font-family: Nunito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.hide { display: none !important; }
/* ---------- conectar ---------- */
#conn { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; overflow: auto; touch-action: pan-y; }
#conn .box { width: min(440px, 100%); display: grid; gap: 16px; justify-items: center; }
#conn h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; }
#conn h1 small { display: block; color: var(--rosa); font-size: 14px; letter-spacing: .14em; }
#conn p { margin: 0; color: var(--lila); font-size: 16px; line-height: 1.4; }
#code { width: 100%; max-width: 280px; padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(201, 178, 255, .4); background: rgba(255, 255, 255, .08); color: #fff; font: 900 32px/1 Nunito, system-ui, sans-serif; letter-spacing: .3em; text-align: center; text-transform: uppercase; -webkit-user-select: text; user-select: text; }
.big { min-height: 52px; padding: 12px 32px; border: 0; border-radius: 6px; background: var(--cta); color: #fff; font-weight: 900; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 0 18px rgba(255, 43, 214, .45); }
#msg { min-height: 24px; font-weight: 800; color: #fff; }
#msg.mal { color: #ffb0b0; }
/* ---------- el mando ---------- */
#pad { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
#top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-width: 0; }
#est { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; font-weight: 800; font-size: 14px; color: var(--lila); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#est i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #f2c230; }
#est.ok i { background: var(--ok); }
#est b { color: #fff; }
.sm { min-width: 52px; min-height: 44px; padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(201, 178, 255, .35); background: rgba(255, 255, 255, .08); font-weight: 900; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.sm.down, .sm.on { background: var(--cta); border-color: transparent; }
.sm { display: inline-flex; align-items: center; gap: 6px; } .sm img, .bt img, #bR img { pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .4)); }
#bR { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
#zonas { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
#izq, #der { position: relative; min-height: 0; touch-action: none; overflow: hidden; }
#izq { border-right: 1px dashed rgba(201, 178, 255, .12); }
.hint { position: absolute; left: 8px; right: 8px; top: 8px; text-align: center; color: rgba(203, 194, 224, .6); font-size: 13px; font-weight: 800; pointer-events: none; }
#izq.tac { background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .02) 0 12px, transparent 12px 24px); border-radius: 12px; margin: 4px; border: 1px solid rgba(201, 178, 255, .2); }
#base { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .05); pointer-events: none; }
#nub { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--cta); box-shadow: 0 0 18px rgba(255, 43, 214, .5); }
/* los cuatro botones, en rombo abajo a la derecha, como en un mando */
#bts { position: absolute; right: 16px; bottom: 16px; width: min(260px, 46vw); aspect-ratio: 1; pointer-events: none; }
.bt { position: absolute; width: 38%; aspect-ratio: 1; display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); background: rgba(40, 16, 80, .88); font-weight: 900; font-size: 13px; line-height: 1.05; text-align: center; text-transform: uppercase; pointer-events: auto; touch-action: none; padding: 4px; overflow: hidden; overflow-wrap: anywhere; }
.bt small { font-size: 11px; color: var(--lila); }
.bt.down { transform: scale(.94); background: var(--cta); }
.bt[data-b="0"] { left: 31%; bottom: 0; width: 42%; background: var(--cta); border-color: rgba(255, 255, 255, .6); font-size: 15px; }
.bt[data-b="1"] { right: 0; top: 31%; }
.bt[data-b="2"] { left: 0; top: 31%; }
.bt[data-b="3"] { left: 31%; top: 0; }
#bR { position: absolute; left: 16px; bottom: 16px; min-width: 96px; height: 56px; padding: 0 16px; border-radius: 28px; border: 2px solid rgba(255, 255, 255, .35); background: rgba(40, 16, 80, .88); font-weight: 900; font-size: 13px; text-transform: uppercase; touch-action: none; }
#bR.down, #bR.on { background: var(--cta); }
/* la copia de los botones del minijuego */
#esp { position: absolute; inset: 8px; display: grid; grid-template-columns: 1fr; gap: 8px; align-content: center; overflow: auto; touch-action: pan-y; }
#esp.dos { grid-template-columns: 1fr 1fr; }
#esp button { min-height: 56px; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(201, 178, 255, .45); background: rgba(40, 16, 80, .9); font-weight: 900; font-size: 15px; line-height: 1.15; text-align: center; overflow-wrap: anywhere; touch-action: none; }
#esp button:first-child { background: var(--cta); border-color: transparent; }
#esp button.down { transform: scale(.97); filter: brightness(1.2); }
#jugar { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 16px; padding: 16px; text-align: center; }
#jugar p { margin: 0; max-width: 360px; color: var(--lila); font-size: 15px; line-height: 1.4; }
#giro { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(0, 0, 0, .5); color: var(--lila); font-size: 13px; font-weight: 800; pointer-events: none; white-space: nowrap; }
@media (orientation: landscape) { #giro { display: none; } }
@media (orientation: portrait) { #zonas { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } #izq { border-right: 0; border-bottom: 1px dashed rgba(201, 178, 255, .12); } #bts { width: min(220px, 56vw); } #base { width: 120px; height: 120px; margin: -60px 0 0 -60px; } #nub { width: 52px; height: 52px; margin: -26px 0 0 -26px; } }
</style>
</head>
<body>
<div id="conn">
  <div class="box">
    <h1><small>Herrizherri</small><span data-t="Mando en el móvil">Mando en el móvil</span></h1>
    <p data-t="Escribe el código que sale en el ordenador (Ajustes o Pausa: «Usar el móvil como mando»).">Escribe el código que sale en el ordenador (Ajustes o Pausa: «Usar el móvil como mando»).</p>
    <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Código">
    <button id="go" class="big" data-t="Conectar">Conectar</button>
    <div id="msg" role="status"></div>
    <p data-t="El móvil y el ordenador, mejor en la misma wifi.">El móvil y el ordenador, mejor en la misma wifi.</p>
  </div>
</div>
<div id="pad" class="hide">
  <div id="top"><div id="est"><i></i><span id="estT"></span></div><span id="sup"></span><button class="sm" id="bFull" aria-label="Pantalla completa">⛶</button></div>
  <div id="zonas">
    <div id="izq"><div class="hint" id="hIzq"></div><div id="base" class="hide"><div id="nub"></div></div><button id="bR" class="hide" data-b="7"></button></div>
    <div id="der"><div class="hint" id="hDer"></div><div id="bts"></div><div id="esp" class="hide"></div>
      <div id="jugar" class="hide"><p data-t="Elige en el ordenador con la flecha, o sigue tu aventura:">Elige en el ordenador con la flecha, o sigue tu aventura:</p><button class="big" id="bJugar" data-t="¡A jugar!">¡A jugar!</button></div></div>
  </div>
  <div id="giro" data-t="Mejor con el móvil en horizontal">Mejor con el móvil en horizontal</div>
</div>
<script type="module">
// ---------- textos (castellano y euskera: el ordenador dice cuál) ----------
const EU = {
  'Mando en el móvil': 'Mugikorra aginte gisa', 'Conectar': 'Konektatu',
  'Escribe el código que sale en el ordenador (Ajustes o Pausa: «Usar el móvil como mando»).': 'Idatzi ordenagailuan ateratzen den kodea (Ezarpenak edo Etenaldia: «Erabili mugikorra aginte gisa»).',
  'El móvil y el ordenador, mejor en la misma wifi.': 'Mugikorra eta ordenagailua, hobe wifi berean.', 'Mejor con el móvil en horizontal': 'Hobe mugikorra etzanda',
  'Conectando…': 'Konektatzen…', 'Conectado': 'Konektatuta', 'Reconectando…': 'Berriro konektatzen…',
  'No encuentro el juego con ese código. Mira el código en el ordenador y que su ventana del mando siga abierta.': 'Ez dut jokoa aurkitzen kode horrekin. Begiratu ordenagailuko kodea eta agintearen leihoa irekita dagoela.',
  'Sin conexión con el servidor de saludo. Comprueba internet en el móvil.': 'Ez dago konexiorik agur-zerbitzariarekin. Begiratu mugikorraren internet.',
  'El código tiene cinco letras o números.': 'Kodeak bost letra edo zenbaki ditu.', 'El juego ha cerrado el mando.': 'Jokoak agintea itxi du.',
  'Desliza para andar': 'Irristatu ibiltzeko', 'Desliza para moverte': 'Irristatu mugitzeko', 'Desliza para mirar': 'Irristatu begiratzeko',
  'Desliza para mover la flecha · toca para pulsar · dos dedos para bajar': 'Irristatu gezia mugitzeko · ukitu sakatzeko · bi hatz jaisteko',
  'Elige en el ordenador con la flecha, o sigue tu aventura:': 'Aukeratu ordenagailuan geziarekin, edo jarraitu zure abenturarekin:', '¡A jugar!': 'Jolastera!',
  'Acción': 'Ekintza', 'Saltar': 'Jauzi', 'Prismáticos': 'Prismatikoak', 'Mochila': 'Motxila', 'Correr': 'Korrika', 'Mapa': 'Mapa', 'Cuaderno': 'Koadernoa', 'Menú': 'Menua', 'Perro': 'Txakurra',
  'Seguir': 'Jarraitu', 'Anotar': 'Idatzi', 'Salir': 'Irten', 'Atrás': 'Atzera', 'Golpe': 'Kolpea', 'Cortada': 'Moztua', 'Dejada': 'Utzia', 'Globo': 'Globoa', 'Pausa': 'Etenaldia',
  'Pase': 'Pasea', 'Tiro': 'Jaurtiketa', 'Cambiar': 'Aldatu', 'Sprint': 'Esprinta', 'Periódico': 'Egunkaria', 'Cámara': 'Kamera', 'Coser': 'Josi',
  'En el pueblo': 'Herrian', 'El encierro': 'Entzierroa', 'Prismáticos ': 'Prismatikoak', 'Hablando': 'Hizketan', 'Pregunta': 'Galdera', 'Pelota a mano': 'Esku pilota', 'Pasaka': 'Pasaka',
  'Fútbol': 'Futbola', 'El esquileo': 'Ardi-mozketa', 'La costura': 'Josketa', 'En el menú': 'Menuan',
};
let LANG = (navigator.language || 'es').toLowerCase().startsWith('eu') ? 'eu' : 'es';
const T = (s) => (LANG === 'eu' && EU[s]) || s;
const traduce = () => { document.documentElement.lang = LANG; document.querySelectorAll('[data-t]').forEach(n => { n.textContent = T(n.dataset.t); }); };
traduce();

// ---------- el saludo (copia de src/mando/senal.js) ----------
const Q = new URLSearchParams(location.search);
const SENAL = Q.get('senal') || 'wss://0.peerjs.com/peerjs';
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }];
function senal(id, onMsg, onClose) {
  return new Promise((ok, ko) => {
    let ws, hb = 0, open = false;
    try { ws = new WebSocket(`${SENAL}?key=peerjs&id=${encodeURIComponent(id)}&token=${Math.random().toString(36).slice(2, 12)}`); } catch (e) { ko(e); return; }
    const api = { send: (dst, type, payload) => { if (ws.readyState === 1) ws.send(JSON.stringify({ type, dst, payload })); }, close: () => { clearInterval(hb); try { ws.close(); } catch (e) { } } };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (er) { return; }
      if (m.type === 'OPEN') { open = true; hb = setInterval(() => ws.readyState === 1 && ws.send('{"type":"HEARTBEAT"}'), 5000); ok(api); }
      else if (!open && (m.type === 'ID-TAKEN' || m.type === 'ERROR' || m.type === 'INVALID-KEY')) ko(new Error(m.type));
      else onMsg(m);
    };
    ws.onerror = () => { if (!open) ko(new Error('red')); };
    ws.onclose = () => { clearInterval(hb); if (open) onClose?.(); else ko(new Error('red')); };
  });
}

// ---------- la conexión ----------
const $ = (s) => document.querySelector(s);
const LETRAS = /^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{5}$/;
const NOHAY = 'No encuentro el juego con ese código. Mira el código en el ordenador y que su ventana del mando siga abierta.';
let code = '', sig = null, pc = null, dc = null, conectado = false, intentos = 0, espera = 0, cerrado = false;
const msg = (t, mal) => { $('#msg').textContent = t ? T(t) : ''; $('#msg').classList.toggle('mal', !!mal); };
async function conectar() {
  code = $('#code').value.trim().toUpperCase();
  if (!LETRAS.test(code)) { msg('El código tiene cinco letras o números.', true); return; }
  history.replaceState(null, '', location.pathname + location.search + '#' + code);
  cerrado = false; msg('Conectando…'); $('#go').disabled = true;
  limpia();
  try { sig = await senal(`hzh-${code}-m${Math.random().toString(36).slice(2, 8)}`, recibe, () => { sig = null; }); }
  catch (e) { msg('Sin conexión con el servidor de saludo. Comprueba internet en el móvil.', true); $('#go').disabled = false; return; }
  pc = new RTCPeerConnection({ iceServers: ICE });
  dc = pc.createDataChannel('mando', { ordered: true });
  dc.onopen = abierto;
  dc.onclose = () => caido();
  dc.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (er) { return; } del(m); };
  pc.onicecandidate = (e) => { if (e.candidate) sig?.send('hzh-' + code, 'CANDIDATE', { candidate: e.candidate.toJSON() }); };
  pc.onconnectionstatechange = () => { if (['failed', 'disconnected'].includes(pc?.connectionState)) caido(); };
  const of = await pc.createOffer(); await pc.setLocalDescription(of);
  sig.send('hzh-' + code, 'OFFER', { sdp: pc.localDescription.toJSON() });
  clearTimeout(espera);
  espera = setTimeout(() => { if (!conectado) { limpia(); msg(NOHAY, true); $('#go').disabled = false; vista(false); } }, 15000);
}
async function recibe(m) {
  if (m.type === 'ANSWER' && pc && m.payload?.sdp) { try { await pc.setRemoteDescription(m.payload.sdp); } catch (e) { } }
  else if (m.type === 'CANDIDATE' && pc && m.payload?.candidate) { try { await pc.addIceCandidate(m.payload.candidate); } catch (e) { } }
  else if (m.type === 'EXPIRE') { clearTimeout(espera); limpia(); msg(NOHAY, true); $('#go').disabled = false; vista(false); }
}
function limpia() { try { dc?.close(); } catch (e) { } try { pc?.close(); } catch (e) { } try { sig?.close(); } catch (e) { } dc = pc = sig = null; }
function abierto() {
  conectado = true; intentos = 0; clearTimeout(espera);
  sig?.close(); sig = null;   // (ya hablan directamente: el servidor del saludo sobra)
  msg(''); $('#go').disabled = false; vista(true); estado(); despierta();
}
function caido() {
  if (!conectado) return;
  conectado = false; soltarTodo(); limpia(); estado();
  if (cerrado) return;
  // (se reintenta unas cuantas veces: si el ordenador cerró el juego, se vuelve a la pantalla del código)
  if (intentos++ < 6) setTimeout(() => { if (!conectado && !cerrado) { $('#code').value = code; conectar(); } }, 2000);
  else { vista(false); msg(NOHAY, true); }
}
const envia = (m) => { if (dc?.readyState === 'open') dc.send(JSON.stringify(m)); };
// lo que dice el ordenador
let C = { m: 'juego', tit: '', pal: 'andar', mira: true, tac: false, b: {}, fijo: [], esp: [] }, lat = 0, pingT = 0, ctxK = '';
function del(m) {
  if (m.t === 'hola') { LANG = m.lang === 'eu' ? 'eu' : 'es'; traduce(); pinta(); }
  else if (m.t === 'ctx') { const k = JSON.stringify(m); if (k !== ctxK) { ctxK = k; soltarTodo(); C = m; pinta(); } }
  else if (m.t === 'pong') { lat = Math.round(performance.now() - pingT); estado(); }
  else if (m.t === 'adios') { cerrado = true; conectado = false; soltarTodo(); limpia(); vista(false); msg('El juego ha cerrado el mando.', true); }
}
setInterval(() => { if (conectado) { pingT = performance.now(); envia({ t: 'ping' }); } }, 2000);
function estado() {
  $('#est').classList.toggle('ok', conectado);
  $('#estT').innerHTML = conectado ? `<b></b>${lat ? ' · ' + lat + ' ms' : ''}` : '';
  if (conectado) $('#estT b').textContent = T(C.tit || 'Conectado'); else $('#estT').textContent = T('Reconectando…');
}
function vista(mando) { $('#conn').classList.toggle('hide', mando); $('#pad').classList.toggle('hide', !mando); }
// (la pantalla no se apaga mientras se juega)
async function despierta() { try { await navigator.wakeLock?.request('screen'); } catch (e) { } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && conectado) despierta(); });

// ---------- los botones de cada momento ----------
const vibra = (ms = 12) => { try { navigator.vibrate?.(ms); } catch (e) { } };
const pulsados = new Map();   // botón → mensaje para soltarlo
function soltarTodo() { for (const [, m] of pulsados) envia(m); pulsados.clear(); document.querySelectorAll('.down').forEach(b => b.classList.remove('down')); if (runOn) { runOn = false; $('#bR').classList.remove('on'); } }
let runOn = false;
// un botón: al apoyar el dedo se pulsa y al levantarlo se suelta (los «fijos», como Correr en el pueblo, se quedan
// puestos hasta tocarlos otra vez)
function enlaza(b, down, up, toggle) {
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation(); vibra();
    if (toggle) { runOn = !runOn; b.classList.toggle('on', runOn); envia(runOn ? down : up); if (runOn) pulsados.set(b, up); else pulsados.delete(b); return; }
    try { b.setPointerCapture(e.pointerId); } catch (er) { }
    b.classList.add('down'); envia(down); pulsados.set(b, up);
  });
  const fin = () => { if (!b.classList.contains('down')) return; b.classList.remove('down'); pulsados.delete(b); envia(up); };
  b.addEventListener('pointerup', fin); b.addEventListener('pointercancel', fin); b.addEventListener('lostpointercapture', fin);
}
const bt = (i, d) => ({ t: 'bt', i, d });
// (el icono del botón, de los del juego: iconos/<nombre>.webp)
const ico = (i, s) => { const n = C.ic?.[i]; return n && /^[a-z]+$/.test(n) ? `<img src="iconos/${n}.webp" width="${s}" height="${s}" alt="" draggable="false">` : ''; };
function pinta() {
  const b = C.b || {}, esp = C.esp || [];
  // arriba: los botones de hombro, Select y Start
  const sup = $('#sup'); sup.innerHTML = '';
  for (const i of [4, 5, 8, 9]) if (b[i]) { const x = document.createElement('button'); x.className = 'sm'; x.innerHTML = ico(i, 26) + '<span></span>'; x.lastChild.textContent = T(b[i]); sup.appendChild(x); enlaza(x, bt(i, 1), bt(i, 0)); }
  // izquierda: la palanca, o el panel táctil
  $('#izq').classList.toggle('tac', !!C.tac && !C.pal);
  $('#hIzq').textContent = C.pal ? T(C.pal === 'andar' ? 'Desliza para andar' : 'Desliza para moverte') : C.tac ? T('Desliza para mover la flecha · toca para pulsar · dos dedos para bajar') : '';
  const r = $('#bR'); r.classList.toggle('hide', !b[7]);
  if (b[7]) { const nr = r.cloneNode(false); r.replaceWith(nr); nr.innerHTML = ico(7, 28) + '<span></span>'; nr.lastChild.textContent = T(b[7]); enlaza(nr, bt(7, 1), bt(7, 0), (C.fijo || []).includes(7)); }
  // derecha: los cuatro botones, la copia de los del minijuego o «¡A jugar!»
  const bts = $('#bts'); bts.innerHTML = '';
  if (!esp.length) for (const i of [3, 2, 1, 0]) if (b[i]) { const x = document.createElement('button'); x.className = 'bt'; x.dataset.b = i; x.innerHTML = `${ico(i, 40)}<span></span><small>${'ABXY'[i]}</small>`; x.querySelector('span').textContent = T(b[i]); if (T(b[i]).length > 8) x.style.fontSize = '11px'; bts.appendChild(x);   // (los nombres largos, como Prismáticos, sin partirse)
 enlaza(x, bt(i, 1), bt(i, 0)); }
  const E = $('#esp'); E.innerHTML = ''; E.classList.toggle('hide', !esp.length); E.classList.toggle('dos', esp.length > 4);
  esp.forEach((t, n) => { const x = document.createElement('button'); x.textContent = t; E.appendChild(x); enlaza(x, { t: 'esp', n, d: 1 }, { t: 'esp', n, d: 0 }); });
  $('#jugar').classList.toggle('hide', !C.jugar || !!esp.length);
  $('#hDer').textContent = C.mira && !esp.length ? T('Desliza para mirar') : '';
  estado();
}
$('#bJugar').addEventListener('click', () => { vibra(); envia({ t: 'jugar' }); });
$('#bFull').onclick = () => { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen?.() : d.requestFullscreen?.({ navigationUI: 'hide' }))?.catch?.(() => {}); try { screen.orientation?.lock?.('landscape').catch(() => {}); } catch (e) { } };

// ---------- izquierda: la palanca o el panel táctil ----------
const izq = $('#izq'), base = $('#base'), nub = $('#nub');
let st = null, ej = { x: 0, y: 0 }, ejSucio = false, cur = { dx: 0, dy: 0 }, toques = new Map(), rue = 0;
izq.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  e.preventDefault(); try { izq.setPointerCapture(e.pointerId); } catch (er) { }
  if (C.pal) {
    if (st) return;
    const r = izq.getBoundingClientRect();
    st = { id: e.pointerId, ox: e.clientX, oy: e.clientY };
    base.style.left = (e.clientX - r.left) + 'px'; base.style.top = (e.clientY - r.top) + 'px'; base.classList.remove('hide'); nub.style.transform = '';
  } else if (C.tac) toques.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), mov: 0 });
});
izq.addEventListener('pointermove', (e) => {
  if (st && e.pointerId === st.id) {
    const R = base.offsetWidth * 0.42;
    let dx = e.clientX - st.ox, dy = e.clientY - st.oy; const l = Math.hypot(dx, dy);
    if (l > R) { dx *= R / l; dy *= R / l; }
    nub.style.transform = `translate(${dx}px, ${dy}px)`;
    ej = { x: +(dx / R).toFixed(3), y: +(-dy / R).toFixed(3) }; ejSucio = true;
  } else if (toques.has(e.pointerId)) {
    const p = toques.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; p.mov += Math.abs(dx) + Math.abs(dy);
    if (toques.size >= 2) rue += dy / toques.size; else { cur.dx += dx; cur.dy += dy; }   // (dos dedos: desplazar la lista)
  }
});
const sueltaIzq = (e) => {
  if (st && e.pointerId === st.id) { st = null; base.classList.add('hide'); ej = { x: 0, y: 0 }; envia({ t: 'ej', x: 0, y: 0 }); ejSucio = false; }
  const p = toques.get(e.pointerId);
  if (p) { toques.delete(e.pointerId); if (e.type === 'pointerup' && p.mov < 12 && performance.now() - p.t < 350 && !toques.size) { vibra(8); envia({ t: 'clic' }); } }
};
izq.addEventListener('pointerup', sueltaIzq); izq.addEventListener('pointercancel', sueltaIzq);

// ---------- derecha: arrastrar gira la cámara ----------
const der = $('#der'); let mi = null, acc = { dx: 0, dy: 0 };
der.addEventListener('pointerdown', (e) => { if (e.target.closest('button, #esp') || mi || !C.mira) return; e.preventDefault(); try { der.setPointerCapture(e.pointerId); } catch (er) { } mi = { id: e.pointerId, x: e.clientX, y: e.clientY }; });
der.addEventListener('pointermove', (e) => { if (!mi || e.pointerId !== mi.id) return; acc.dx += e.clientX - mi.x; acc.dy += e.clientY - mi.y; mi.x = e.clientX; mi.y = e.clientY; });
const sueltaMi = (e) => { if (mi && e.pointerId === mi.id) mi = null; };
der.addEventListener('pointerup', sueltaMi); der.addEventListener('pointercancel', sueltaMi);
// (la palanca, la cámara y la flecha, unas 30 veces por segundo y solo si cambian)
setInterval(() => {
  if (!conectado) return;
  if (ejSucio) { envia({ t: 'ej', x: ej.x, y: ej.y }); ejSucio = false; }
  if (acc.dx || acc.dy) { envia({ t: 'mira', dx: acc.dx, dy: acc.dy }); acc = { dx: 0, dy: 0 }; }
  if (cur.dx || cur.dy) { envia({ t: 'cur', dx: cur.dx, dy: cur.dy }); cur = { dx: 0, dy: 0 }; }
  if (Math.abs(rue) >= 1) { envia({ t: 'rueda', dy: -Math.round(rue) * 3 }); rue = 0; }
}, 33);

// ---------- arranque ----------
document.addEventListener('contextmenu', (e) => e.preventDefault());
$('#go').onclick = () => conectar();
$('#code').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 5); if (e.target.value.length === 5) conectar(); });
$('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') conectar(); });
pinta();
const h = location.hash.slice(1).toUpperCase();
if (LETRAS.test(h)) { $('#code').value = h; conectar(); }
window.__mandoMovil = { get conectado() { return conectado; }, get ctx() { return C; } };   // (para las pruebas)
</script>
