<!-- la app instalada en el iPhone: iOS 26 le da una ventana una barra de estado más corta que la pantalla (47 puntos en
     un iPhone 12 a 14; WebKit 301108) mientras la página no sea más alta que la pantalla, y abajo queda una franja vacía.
     Con la página tan alta como la pantalla entera, iOS le da la pantalla entera. Se mide con el tamaño de la pantalla,
     que en el iPhone no cambia al girarlo (en el iPad la ventana puede ser menor que la pantalla: allí no se toca) -->
<script id="alto-app">(function () {
  if (navigator.standalone !== true || !/iPhone|iPod/.test(navigator.userAgent)) return;
  var d = document.documentElement, mq = matchMedia('(orientation: landscape)');
  function alto() { var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height); d.style.minHeight = (mq.matches ? a : b) + 'px'; }
  alto(); if (mq.addEventListener) mq.addEventListener('change', alto); else mq.addListener(alto);
  addEventListener('orientationchange', function () { setTimeout(alto, 300); });
})();</script>
<!-- la partida que llega de la app antigua (#traspaso=…, de public/mudanza.html; src/util/traspaso.js): se guarda antes de
     que arranque el juego y se quita de la dirección. Si aquí ya había una partida, se pregunta -->
<script id="traspaso">(function () {
  var m = /^#traspaso=HZ0:([A-Za-z0-9_-]+)/.exec(location.hash); if (!m) return;
  try {
    var b = atob(m[1].replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    var d = JSON.parse(new TextDecoder().decode(u)), hay = localStorage.getItem('herrizherri-perfil-v1');
    if (d && typeof d['herrizherri-perfil-v1'] === 'string' && (!hay || hay === d['herrizherri-perfil-v1'] || confirm('Llega tu partida de la app antigua. ¿La pones en lugar de la que hay aquí?')))
      for (var k in d) if (/^herrizherri-/.test(k) && typeof d[k] === 'string') localStorage.setItem(k, d[k]);
  } catch (e) { }
  history.replaceState(null, '', location.pathname + location.search);
})();</script>

<script id="ir-a-web">if (/github\.io$/.test(location.hostname) && /\/descargas\/[^/]*$/.test(location.pathname) && !/[?&]unico\b/.test(location.search)) location.replace('../' + location.search + location.hash);</script>

<div id="arranque" style="position:fixed;inset:0;z-index:9999;display:grid;place-content:center;gap:12px;padding:24px;background:#1e1830;color:#f6f3fc;text-align:center;font:600 16px/1.45 system-ui,-apple-system,sans-serif;overflow:auto;user-select:text;-webkit-user-select:text;display:none"></div>
<script id="aviso-arranque">
(function () {
  // (soloWeb: la versión web abierta como archivo suelto, sin su carpeta assets ni servidor; no hay nada que arreglar,
  // solo decir qué archivo abrir. El archivo único lleva todo dentro y no pasa por aquí)
  var box = document.getElementById('arranque'), errs = [], t0 = Date.now(), soloWeb = false;
  // si el móvil cierra la página al arrancar (sin memoria), se vuelve a abrir sola y no llega a ningún aviso: cada arranque
  // se apunta y se borra al salir bien, al dejar la app con el menú ya a la vista o tras 10 s de menú. Si los dos
  // anteriores no acabaron, el juego arranca en modo sencillo (src/util/sencillo.js: calidad baja y el mapa 3D más
  // ligero), que se quita en Ajustes. (Antes se borraba a los 25 s: en el iPhone, abrir la app y salir enseguida dos
  // veces la dejaba en modo sencillo, sin la entrada del mapa. Quien quedó así sale de él una vez, KS2)
  var KA = 'herrizherri-arranque', KS = 'herrizherri-sencillo', KS2 = 'herrizherri-sencillo-revisado';
  try { if (!localStorage.getItem(KS2)) { if (localStorage.getItem(KS) === 'auto') localStorage.removeItem(KS); localStorage.removeItem(KA); localStorage.setItem(KS2, '1'); } } catch (e) { }
  try { var n = +(localStorage.getItem(KA) || 0) + 1; localStorage.setItem(KA, n); if (n >= 3 && !localStorage.getItem(KS)) localStorage.setItem(KS, 'auto'); } catch (e) { }
  var bien = function () { try { localStorage.removeItem(KA); } catch (e) { } };
  addEventListener('pagehide', bien);
  document.addEventListener('visibilitychange', function () { if (document.hidden && listo) bien(); });
  addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName) { errs.push('No carga un ' + t.tagName.toLowerCase()); if (t.tagName === 'SCRIPT' && location.protocol === 'file:') soloWeb = true; }
    else errs.push(String(e.message || e.error || 'Error') + (e.lineno ? ' · línea ' + e.lineno + ', columna ' + e.colno : ''));
  }, true);
  addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push(String(r && r.message || r)); });
  function line(txt, css) { var d = document.createElement('div'); d.textContent = txt; if (css) d.style.cssText = css; return d; }
  function boton(txt, fn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.onclick = fn; b.style.cssText = 'font:700 15px system-ui,-apple-system,sans-serif;color:#fff;background:#5b2bd6;border:0;border-radius:12px;padding:12px 18px;min-height:44px'; return b; }
  // (borrar la caché: la copia guardada del juego, no la partida)
  function limpia() { var p = []; try { if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) { }
    Promise.all(p).catch(function () { }).then(function () { location.reload(); }); }
  function webgl() { try { var c = document.createElement('canvas'), g = c.getContext('webgl2'); if (!g) return 'no'; var x = g.getExtension('WEBGL_lose_context'); if (x) x.loseContext(); return 'sí'; } catch (e) { return 'no'; } }
  var listo = 0, iv = setInterval(function () {
    var ui = document.getElementById('ui');
    if (window.__hub || window.__game || (ui && ui.childElementCount)) { box.style.display = 'none'; clearInterval(iv); if (!listo) { listo = 1; setTimeout(bien, 10000); } return; }
    if (Date.now() - t0 < (soloWeb ? 2000 : 20000)) return;
    // (con el aviso ya puesto, solo se rehace si llega otro error: así no se pierde un toque en sus botones)
    if (box.style.display === 'grid' && +box.dataset.n === errs.length) return; box.dataset.n = errs.length;
    box.textContent = '';
    box.appendChild(line(soloWeb ? 'Este archivo es la versión web' : 'El juego no ha arrancado', 'font-size:22px;font-weight:800'));
    box.appendChild(line(soloWeb ? 'Suelto en el ordenador no abre: le faltan sus archivos. Para jugar sin conexión, abre HERRIZHERRI-jugar.html.' : 'Haz una captura de esta pantalla y envíala.'));
    var det = errs.length ? errs.slice(0, 5) : ['Sin errores a la vista: puede que aún esté cargando o que falte memoria.'];
    for (var i = 0; i < det.length; i++) box.appendChild(line(det[i].slice(0, 240), 'font:500 13px/1.4 ui-monospace,Menlo,monospace;overflow-wrap:anywhere;color:#ffd27a'));
    box.appendChild(line(navigator.userAgent + ' · ' + innerWidth + ' × ' + innerHeight + ' · WebGL 2: ' + webgl() + ' · ' + Math.round((Date.now() - t0) / 1000) + ' s', 'font:500 12px/1.4 ui-monospace,Menlo,monospace;overflow-wrap:anywhere;opacity:.75'));
    if (!soloWeb) {
      var fila = document.createElement('div'); fila.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px';
      fila.appendChild(boton('Volver a cargar', function () { location.reload(); }));
      fila.appendChild(boton('Modo sencillo', function () { try { localStorage.setItem(KS, '1'); } catch (e) { } location.reload(); }));
      if (navigator.serviceWorker || window.caches) fila.appendChild(boton('Borrar caché y cargar', limpia));
      box.appendChild(fila);
    }
    box.style.display = 'grid';
  }, 2000);
})();
</script>
