<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#20242c;overflow:hidden}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { cocinaPublico, mallaPublico, crowdAnim } from '/src/actors/crowdAnim.js';
const P = new URLSearchParams(location.search), W = innerWidth, H = innerHeight;
const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(W, H); R.setPixelRatio(1); document.body.appendChild(R.domElement);
R.outputColorSpace = THREE.SRGBColorSpace;
const S = new THREE.Scene(); S.background = new THREE.Color(0x2a3040);
S.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(2, 5, 4); S.add(d);
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(40, 8), new THREE.MeshStandardMaterial({ color: 0x556070 })); suelo.rotation.x = -Math.PI / 2; S.add(suelo);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
window.__err = null; addEventListener('error', e => { window.__err = String(e.message); });
try {
  const F = await cocinaPublico('aficion'); window.__F = F;
  window.__info = F.map(f => ({ n: f.nombre, huesos: f.huesos, cuadros: f.cuadros, tri: f.geo.index.count / 3, triLejos: f.lejos.index.count / 3, clips: f.clips }));
  const modo = P.get('modo') || 'tira';
  if (modo === 'tira') {
    const f = +(P.get('f') || 0), clip = P.get('clip') || 'subeA', C = F[f].clips[clip], paso = +(P.get('paso') || 1), lejos = P.get('lejos') === '1';
    const ks = []; for (let k = 0; k < C.n; k += paso) ks.push(k);
    const im = mallaPublico(F[f], ks.length, !lejos), m4 = new THREE.Matrix4(), ry = +(P.get('ry') || 0.9), sep = +(P.get('sep') || 1.05);
    ks.forEach((k, j) => { m4.makeRotationY(ry); m4.setPosition((j - (ks.length - 1) / 2) * sep, 0, 0); im.setMatrixAt(j, m4); const a = im.userData.anim.array; a[j * 3] = C.f0 + k; a[j * 3 + 1] = C.f0 + k; a[j * 3 + 2] = 0; });
    im.count = ks.length; im.visible = true; im.instanceMatrix.needsUpdate = true; im.userData.anim.needsUpdate = true; S.add(im);
    // el asiento, de referencia
    const banco = new THREE.Mesh(new THREE.BoxGeometry(ks.length * sep, 0.04, 0.4), new THREE.MeshStandardMaterial({ color: 0x8a6a40 })); banco.position.set(0, +(P.get('banco') || 0.36), 0); if (P.get('banco') !== '0') S.add(banco);
    const ancho = ks.length * sep; cam.position.set(0, 1.0, ancho / (2 * Math.tan(15 * Math.PI / 180) * (W / H)) + 0.6); cam.lookAt(0, 0.75, 0);
    R.render(S, cam);
  } else {
    // una grada pequeña con el público entero, para ver la celebración en marcha
    const spots = []; for (let r = 0; r < 4; r++) for (let k = 0; k < 9; k++) spots.push([(k - 4) * 1.1 + (r % 2) * 0.55, r * 0.45, -r * 0.85, 0]);
    // la grada: escalones y bancos, como en un frontón
    const mEsc = new THREE.MeshStandardMaterial({ color: 0x9a968c }), mBan = new THREE.MeshStandardMaterial({ color: 0x8a5a30 });
    for (let r = 0; r < 4; r++) {
      const e = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.45, 0.85), mEsc); e.position.set(0.25, r * 0.45 - 0.225, -r * 0.85 + 0.075); S.add(e);
      const bn = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.05, 0.32), mBan); bn.position.set(0.25, r * 0.45 + 0.27, -r * 0.85 - 0.1); S.add(bn);
    }
    const tras = new THREE.Mesh(new THREE.BoxGeometry(11.5, 3.4, 0.2), new THREE.MeshStandardMaterial({ color: 0x4a5a48 })); tras.position.set(0.25, 1.7, -3.5); S.add(tras);
    const g = crowdAnim(spots, 'aficion', 1.24, { kc: +(P.get('kc') || 100) }); S.add(g); await g.listo; window.__g = g;
    cam.position.set(+(P.get('cx') || -3.6), +(P.get('cy') || 2.5), +(P.get('cz') || 6.2)); cam.lookAt(0.2, 1.05, -1.1);
    cam.updateMatrixWorld(true);
    let t = 0; window.__t = (x) => { t = x; g.tick(t, 1, 0, cam); R.render(S, cam); }; window.__cheer = (len) => g.cheer(true, null, len);
    window.__t(0); window.__t(0.01);
  }
  window.__listo = true;
} catch (e) { window.__err = String(e && e.stack || e); console.error(e); }
</script></body></html>
